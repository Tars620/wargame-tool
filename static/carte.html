<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte</title>
<link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
<style>
@font-face { font-family: Inter; src: url(/static/fonts/inter-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --fond: #0a0a0c; --panneau: #111214; --panneau-2: #17181b; --trait: #2a2c30; --trait-fort: #4a4d54;
  --texte: #e8e8ea; --texte-2: #9a9aa2;
  --accent: #ffffff; --barre: #000000; --pion-fond: #000000; --invert-ctrl: invert(1);
  --bleu: #4c8dff; --rouge: #e5484d;   /* réservés aux camps et aux états */
  --t-xs: 11px; --t-sm: 12px; --t-base: 13px; --t-md: 14px; --barre-h: 38px; --outils-h: 38px;
  --haut: calc(var(--barre-h) + var(--outils-h)); --g: 300px; --d: 320px; --gauche-w: var(--g); --droite-w: var(--d);
}
/* Thème clair : mêmes règles (angles droits, Inter), couleurs inversées. Bleu et rouge restent réservés aux camps. */
:root[data-theme=clair] {
  --fond: #f5f5f7; --panneau: #ffffff; --panneau-2: #f0f0f2; --trait: #d2d2d7; --trait-fort: #b0b0b5;
  --texte: #1d1d1f; --texte-2: #6e6e73; --accent: #000000; --barre: #ffffff; --pion-fond: #ffffff; --invert-ctrl: none;
}
*, *::before, *::after { box-sizing: border-box; border-radius: 0 !important; }
html, body { height: 100%; margin: 0; }
body { font: 300 var(--t-md)/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--texte); background: var(--fond); }
.top { position: fixed; inset: 0 0 auto 0; height: var(--barre-h); background: var(--barre); border-bottom: 1px solid var(--trait); display: flex; align-items: center; gap: 18px; padding: 0 14px; z-index: 5; }
.top b { font-weight: 500; letter-spacing: .04em; text-transform: uppercase; font-size: var(--t-base); }
.top a { color: var(--texte-2); text-decoration: none; font-size: var(--t-base); }
.top a:hover { color: var(--accent); }
#map { position: fixed; top: var(--haut); bottom: 0; left: var(--gauche-w); right: var(--droite-w); }
body.g-ferme { --gauche-w: 0px; } body.d-ferme { --droite-w: 0px; }
.panneau { position: fixed; top: var(--haut); bottom: 0; overflow: auto; background: var(--panneau); border: 1px solid var(--trait); border-top: 0; border-bottom: 0; padding: 14px; z-index: 4; transition: transform .15s ease; }
.gauche { left: 0; width: var(--g); border-left: 0; } .droite { right: 0; width: var(--d); border-right: 0; }
body.g-ferme .gauche { transform: translateX(-100%); } body.d-ferme .droite { transform: translateX(100%); }
.onglet { position: fixed; top: calc(var(--haut) + 40px); z-index: 5; width: 20px; height: 56px; padding: 0; background: var(--panneau); border: 1px solid var(--trait); color: var(--texte-2); font-size: 18px; line-height: 1; }
#onglet-g { left: var(--gauche-w); border-left: 0; } #onglet-d { right: var(--droite-w); border-right: 0; }
.panneau h3 { margin: 18px 0 8px; font-size: var(--t-sm); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--texte-2); }
.panneau h3:first-child { margin-top: 0; }
.panneau h4 { margin: 14px 0 6px; font-size: var(--t-sm); font-weight: 500; color: var(--texte); }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 7px 9px; margin-top: -1px; border: 1px solid var(--trait); font-size: var(--t-base); cursor: pointer; }
.opt:has(input:checked) { background: var(--panneau-2); border-color: var(--accent); position: relative; }
.opt input { margin: 2px 0 0; accent-color: var(--accent); }
.opt small, .modele small { display: block; color: var(--texte-2); font-size: var(--t-sm); }
select, input[type=text] { width: 100%; padding: 7px 9px; border: 1px solid var(--trait); background: var(--fond); color: var(--texte); font: inherit; }
select:focus, input[type=text]:focus { outline: 1px solid var(--accent); }
button { font: inherit; font-weight: 300; color: var(--texte); background: transparent; border: 1px solid var(--trait-fort); padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.note { margin: 8px 0 0; font-size: var(--t-sm); color: var(--texte-2); }
.err { margin: 8px 0 0; font-size: var(--t-sm); color: var(--rouge); min-height: 1em; }
.lecture { position: fixed; left: calc(var(--gauche-w) + 8px); bottom: 8px; z-index: 4; background: var(--panneau); border: 1px solid var(--trait); padding: 4px 9px; font-size: var(--t-sm); color: var(--texte-2); font-variant-numeric: tabular-nums; }

/* banque de pièces */
.camps { display: flex; margin-bottom: 8px; }
.camp { flex: 1; margin-left: -1px; border-color: var(--trait); color: var(--texte-2); }
.camp:first-child { margin-left: 0; }
.camp[aria-pressed=true] { color: var(--accent); border-color: var(--c); background: var(--panneau-2); box-shadow: inset 0 -2px 0 var(--c); }
.modele { display: flex; gap: 10px; width: 100%; text-align: left; margin-top: -1px; padding: 8px 10px; border-color: var(--trait); }
.modele.arme { border-color: var(--accent); background: var(--panneau-2); }
.modele .ico { flex: none; width: 40px; display: flex; align-items: center; justify-content: center; }
.modele .txt b { display: block; font-weight: 500; font-size: var(--t-base); }
.champ { display: grid; grid-template-columns: 62px 1fr auto; align-items: center; gap: 8px; margin: 4px 0; font-size: var(--t-base); }
.champ span { color: var(--texte-2); } .champ em { font-style: normal; color: var(--texte-2); font-size: var(--t-sm); min-width: 34px; }
.champ.large { grid-template-columns: 62px 1fr; margin-bottom: 8px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.duo .champ { grid-template-columns: 1fr; gap: 2px; } .duo .champ em { display: none; }
.barre { display: inline-flex; gap: 2px; margin: 4px 0; } .barre i { width: 14px; height: 8px; border: 1px solid var(--trait-fort); }
.barre i.plein { background: var(--accent); border-color: var(--accent); }
.danger { margin-top: 12px; width: 100%; color: var(--rouge); border-color: var(--trait-fort); }
.danger:hover { border-color: var(--rouge); }

/* pièces posées sur la carte */
.pion { padding: 0; border: 0; background: transparent; line-height: 0; cursor: grab; }
.symbole { display: inline-flex; line-height: 0; } .symbole svg { display: block; }
.pion.choisi { outline: 2px solid var(--accent); outline-offset: 2px; }

details { border-top: 1px solid var(--trait); padding: 4px 0 10px; }
details:first-of-type { border-top: 0; }
summary { cursor: pointer; list-style: none; margin: 10px 0 8px; font-size: var(--t-sm); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--texte-2); }
summary::-webkit-details-marker { display: none; }
summary::before { content: '+'; display: inline-block; width: 14px; }
details[open] > summary::before { content: '−'; }

/* horloges, consignes, météo */
.horloges { margin-left: auto; display: flex; gap: 22px; font-size: var(--t-base); font-variant-numeric: tabular-nums; color: var(--texte); }
.horloges b { font-weight: 500; margin-right: 4px; color: var(--texte-2); text-transform: uppercase; letter-spacing: .05em; font-size: var(--t-xs); }
.horloges em { font-style: normal; color: var(--texte-2); font-size: var(--t-sm); }
.horloges .discret { color: var(--texte-2); } .horloges .etat { border: 1px solid var(--trait-fort); padding: 0 8px; }
.primaire { background: var(--accent); color: var(--fond); border-color: var(--accent); }
.primaire:hover { opacity: .85; } .primaire:disabled { opacity: .35; cursor: default; }
.avert { margin: 6px 0 0; font-size: var(--t-sm); color: #d9a441; }
:root[data-theme=clair] .avert { color: #a06a00; }
.consigne { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--trait); margin-top: -1px; padding: 6px 8px; font-size: var(--t-base); }
.consigne small { display: block; color: var(--texte-2); font-size: var(--t-sm); } .consigne b { font-weight: 500; }
.consigne button { padding: 2px 8px; }
.evt { padding: 6px 0; border-bottom: 1px solid var(--trait); font-size: var(--t-base); } .evt small { display: block; color: var(--texte-2); font-size: var(--t-xs); }
.evt-tir span, .evt-alerte span { color: var(--rouge); } .evt-contact span { color: var(--bleu); }
.ligne-meteo { margin: 2px 0; color: var(--texte); font-size: var(--t-base); }
#scenario-panneau { display: grid; gap: 6px; }
#temps-panneau > * { margin-top: 6px; } #temps-panneau .camps { margin-bottom: 0; }
#temps-panneau input[type=datetime-local] { width: 100%; padding: 7px 9px; border: 1px solid var(--trait); background: var(--fond); color: var(--texte); font: inherit; color-scheme: dark; }
:root[data-theme=clair] #temps-panneau input[type=datetime-local] { color-scheme: light; }

/* barre d'outils de dessin */
.barre-outils { position: fixed; top: var(--barre-h); left: 0; right: 0; height: var(--outils-h); z-index: 4; display: flex; align-items: center; gap: 16px; background: var(--panneau); border-bottom: 1px solid var(--trait); }
.outils { display: flex; align-items: stretch; height: 100%; border: 0; }
.outils button { white-space: nowrap; border: 0; border-right: 1px solid var(--trait); padding: 8px 12px; font-size: var(--t-base); }
.outils button[aria-pressed=true]:not(.pastille) { background: var(--panneau-2); box-shadow: inset 0 -2px 0 var(--accent); color: var(--accent); }
.outils .sep { width: 1px; align-self: stretch; background: var(--trait-fort); }
.outils .pastille { width: 24px; height: 24px; padding: 0; margin: 0 5px; border: 1px solid var(--trait-fort); background: var(--c); }
.outils .pastille[aria-pressed=true] { outline: 2px solid var(--accent); outline-offset: 1px; }
.aide { flex: 1 1 auto; min-width: 0; padding: 0 14px; font-size: var(--t-sm); color: var(--texte-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.poignee { width: 12px; height: 12px; background: var(--accent); border: 2px solid var(--fond); cursor: grab; }

/* commandes de la carte */
.maplibregl-ctrl-group { background: var(--panneau) !important; border: 1px solid var(--trait); box-shadow: none !important; }
.maplibregl-ctrl-group button { border: 0; border-bottom: 1px solid var(--trait); }
.maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: var(--invert-ctrl); }
.maplibregl-ctrl-scale { background: color-mix(in srgb, var(--panneau) 88%, transparent) !important; color: var(--texte) !important; border-color: var(--texte-2) !important; font-family: Inter, system-ui, sans-serif; }
.maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--panneau) 88%, transparent) !important; color: var(--texte-2) !important; font-family: Inter, system-ui, sans-serif; }
.maplibregl-ctrl-attrib a { color: var(--texte-2) !important; }
@media (max-width: 900px) { :root { --g: 250px; --d: 0px; } .droite, #onglet-d { display: none; } }
</style>
</head>
<body>
<div class="top"><b>Carte</b><a href="/">Journal de partie</a><div class="horloges" id="horloges"></div></div>
<div id="map"></div>
<button type="button" class="onglet" id="onglet-g" aria-label="Replier ou déplier le panneau de gauche" title="Replier / déplier">‹</button>
<button type="button" class="onglet" id="onglet-d" aria-label="Replier ou déplier le panneau de droite" title="Replier / déplier">›</button>
<div class="barre-outils"><div class="outils" id="outils"></div><div class="aide" id="aide-dessin"></div></div>

<aside class="panneau gauche">
  <details open data-cle="g-affichage"><summary>Affichage</summary><div id="theme" class="camps"></div></details>
  <details open data-cle="g-fond"><summary>Fond</summary><div id="fonds"></div></details>
  <details open data-cle="g-sup"><summary>Superpositions</summary>
    <label class="opt"><input type="checkbox" id="labels" checked><span>Frontières et noms<small>Sur tous les fonds</small></span></label>
    <label class="opt"><input type="checkbox" id="relief3d"><span>Relief en 3D<small>Inclinaison de la vue, glisser avec Ctrl</small></span></label>
  </details>
  <details open data-cle="g-temps"><summary>Temps de jeu</summary><div id="temps-panneau"></div></details>
  <details data-cle="g-meteo"><summary>Météo</summary><div id="meteo-panneau"></div></details>
  <details data-cle="g-scenario"><summary>Scénario</summary><div id="scenario-panneau"></div></details>
  <details open data-cle="g-zone"><summary>Zone de jeu</summary><select id="zone"></select><p class="note" id="zoneinfo"></p></details>
  <div class="err" id="err"></div>
</aside>

<aside class="panneau droite">
  <details open data-cle="d-ops"><summary>Opération</summary><div id="operation"></div></details>
  <details open data-cle="d-consignes"><summary>Consignes</summary><div id="consignes"></div></details>
  <details open data-cle="d-journal"><summary>Journal des opérations</summary><div id="journal-ops"></div></details>
  <details open data-cle="d-dessin"><summary>Dessin sélectionné</summary><div id="dessin-fiche"></div></details>
  <details open data-cle="d-dessins"><summary>Dessins</summary><div id="dessins-liste"></div></details>
  <details open data-cle="d-fiche"><summary>Pièce sélectionnée</summary><div id="fiche"></div></details>
  <details open data-cle="d-banque"><summary>Banque de pièces</summary><div id="banque"></div></details>
  <details data-cle="d-portees"><summary>Portées affichées</summary><div id="portees"></div></details>
</aside>

<div class="lecture" id="lecture">—</div>
<script src="/static/vendor/pmtiles.js"></script>
<script src="/static/vendor/tz.js"></script>
<script src="/static/vendor/turf.min.js"></script>
<script src="/static/vendor/milsymbol.js"></script>
<script type="module" src="/static/carte.js"></script>
</body>
</html>
